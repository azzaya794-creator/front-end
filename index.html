<!DOCTYPE html>
<html>
<head>
<style>
.omega {
    display: grid;
    grid-template-columns: repeat(5, 50px);
    gap: 10px;
}
.alpha {
    background: lightblue;
    border-style: solid;
    border-color: blue; 
    text-align: center;
    padding: 10px;
    font-size: 18px;
}
</style>
</head>
<body>
<div class="omega">
    <div class="alpha">1</div>
    <div class="alpha">2</div>
    <div class="alpha">3</div>
    <div class="alpha">4</div>
    <div class="alpha">5</div>
    <div class="alpha">6</div>
    <div class="alpha">7</div>
    <div class="alpha">8</div>
    <div class="alpha">9</div>
    <div class="alpha">10</div>
</body>
</html>
