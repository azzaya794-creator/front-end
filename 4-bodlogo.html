        let jo = document.getElementById("jo");
        
        function min4(a, b, c, d) {
            let min = a;

            if (b < min) min = b;
            if (c < min) min = c;
            if (d < min) min = d;

            return min;
        }

        const a = 4;
        const b = 7;
        const c = 1;
        const d = 5;
        const result = min4(a, b, c, d);
        console.log(result);

        function sumeven() {
            let sumeven = 0;

            for (let i = 1; i <= 10; i++) {
                if (i % 2 === 0) {
                    sumeven += i;
                }
            }
            return sumeven;
        }

        const zero = sumeven();
        console.log(zero);

        function Odd() {
            const odds = [];
            for (let i = 1; i <= 20; i++) {
                if (i % 2 !== 0) {
                    odds.push(i);
                }
            }
            odds.forEach(n => console.log(n));
            return odds;
        }
        Odd();

        function isPrime(num) {
            if (num <= 1) 
                return false;
            if (num === 2)
                return true;
            if (num % 2 === 0)
                return false;

            for (let i = 3; i * i <= num; i += 2) {
                if (num % i === 0) {
                    return false;
                }
            }
            return true;
        }
        const check = isPrime(11);
        console.log(check);
    </script>
